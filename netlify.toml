[build]
  # Sitio estático: solo hay que empaquetar las functions
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # La API key de Firebase (AIza...) es pública por diseño — va en el cliente
  # y la seguridad está en las reglas de Firestore. Apagamos la detección de
  # patrones conocidos para que no marque esa key como secreto expuesto.
  # El Access Token de MP sigue protegido: vive en env var, no en el código.
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[functions]
  node_bundler = "esbuild"

# Cabeceras seguras que no interfieren con Mercado Pago, Maps ni Firebase.
# La CSP se incorporará al modularizar los scripts inline y poder probarla
# con todos los proveedores externos activos.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin"
